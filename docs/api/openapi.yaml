    # ------------------------------------------------------------------ actividades
    ActivityMeasures:
      type: object
      description: |
        Datos crudos de avance y costo de una actividad; son la entrada del cálculo EVM.
        `budgetAtCompletion` debe ser mayor que 0 (un presupuesto cero se rechaza con `400`);
        `actualCost` puede ser 0 y los porcentajes pueden ser 0 (estados legítimos).
      required: [budgetAtCompletion, plannedProgressPercent, actualProgressPercent, actualCost]
      properties:
        budgetAtCompletion:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 999999999999.99
          description: BAC. Presupuesto total planificado de la actividad al 100 %. Debe ser > 0. Dos decimales.
        plannedProgressPercent:
          $ref: '#/components/schemas/Percent'
          description: Porcentaje de avance planificado a la fecha de corte (0–100).
        actualProgressPercent:
          $ref: '#/components/schemas/Percent'
          description: Porcentaje de avance real a la fecha de corte (0–100).
        actualCost:
          type: number
          format: double
          minimum: 0
          maximum: 999999999999.99
          description: AC. Costo real incurrido hasta la fecha. Debe ser >= 0. Dos decimales.
      examples:
        - budgetAtCompletion: 40000.00
          plannedProgressPercent: 50.00
          actualProgressPercent: 40.00
          actualCost: 20000.00

    ActivityInput:
      description: |
        Cuerpo de creación y edición de una actividad (POST y PUT).

        `ownerId`: para `REGISTRAR` es opcional (se asigna a sí mismo; si lo envía debe ser su propio
        id); para `REVIEWER` es obligatorio y debe existir. Incumplirlo responde `400`.
      allOf:
        - $ref: '#/components/schemas/ActivityMeasures'
        - type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
              description: Nombre de la actividad.
            ownerId:
              type: [string, 'null']
              format: uuid
              description: Id del usuario responsable. Ver reglas por rol.
      examples:
        - name: Desarrollo
          ownerId: 11111111-1111-4111-8111-000000000003
          budgetAtCompletion: 40000.00
          plannedProgressPercent: 50.00
          actualProgressPercent: 40.00
          actualCost: 20000.00

    Activity:
      description: Actividad persistida con sus datos crudos (sin indicadores).
      allOf:
        - $ref: '#/components/schemas/ActivityMeasures'
        - type: object
          required: [id, projectId, name, owner, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            projectId:
              type: string
              format: uuid
            name:
              type: string
            owner:
              $ref: '#/components/schemas/UserSummary'
              description: Usuario responsable de la actividad.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
      examples:
        - id: 33333333-3333-4333-8333-000000000002
          projectId: 22222222-2222-4222-8222-000000000001
          name: Desarrollo
          owner:
            id: 11111111-1111-4111-8111-000000000003
            fullName: Ana Registradora
          budgetAtCompletion: 40000.00
          plannedProgressPercent: 50.00
          actualProgressPercent: 40.00
          actualCost: 20000.00
          createdAt: '2026-09-08T12:00:00Z'
          updatedAt: '2026-09-08T12:00:00Z'

    # ------------------------------------------------------------------ reporte EVM
    CostStatus:
      type: string
      description: |
        Interpretación del CPI (comparado con 1 sobre el valor redondeado a 4 decimales):
        `UNDER_BUDGET` (CPI > 1), `ON_BUDGET` (CPI = 1), `OVER_BUDGET` (CPI < 1),
        `NOT_APPLICABLE` (CPI no calculable; el motivo va en `notes`).
      enum: [UNDER_BUDGET, ON_BUDGET, OVER_BUDGET, NOT_APPLICABLE]

    ScheduleStatus:
      type: string
      description: |
        Interpretación del SPI (comparado con 1 sobre el valor redondeado a 4 decimales):
        `AHEAD_OF_SCHEDULE` (SPI > 1), `ON_SCHEDULE` (SPI = 1), `BEHIND_SCHEDULE` (SPI < 1),
        `NOT_APPLICABLE` (SPI no calculable; el motivo va en `notes`).
      enum: [AHEAD_OF_SCHEDULE, ON_SCHEDULE, BEHIND_SCHEDULE, NOT_APPLICABLE]

    EvmIndicators:
      type: object
      description: |
        Indicadores de Valor Ganado. El mismo esquema se usa para una actividad y para el
        consolidado del proyecto. Dinero con 2 decimales, índices con 4, redondeo *half up*
        aplicado solo al final (EAC se calcula con el CPI sin redondear).
      required:
        - budgetAtCompletion
        - plannedValue
        - earnedValue
        - actualCost
        - costVariance
        - scheduleVariance
        - costPerformanceIndex
        - schedulePerformanceIndex
        - estimateAtCompletion
        - varianceAtCompletion
        - costStatus
        - scheduleStatus
        - notes
      properties:
        budgetAtCompletion:
          $ref: '#/components/schemas/Money'
          description: BAC. Presupuesto total (suma de las actividades en el consolidado).
        plannedValue:
          $ref: '#/components/schemas/Money'
          description: PV = %plan × BAC. Valor del trabajo que debería estar hecho.
        earnedValue:
          $ref: '#/components/schemas/Money'
          description: EV = %real × BAC. Valor del trabajo realmente hecho, a precio de presupuesto.
        actualCost:
          $ref: '#/components/schemas/Money'
          description: AC. Costo real incurrido.
        costVariance:
          $ref: '#/components/schemas/Money'
          description: CV = EV − AC. Positivo = ahorro; negativo = sobrecosto.
        scheduleVariance:
          $ref: '#/components/schemas/Money'
          description: SV = EV − PV. Positivo = adelantado; negativo = atrasado.
        costPerformanceIndex:
          $ref: '#/components/schemas/PerformanceIndex'
          description: CPI = EV / AC. `null` si AC = 0.
        schedulePerformanceIndex:
          $ref: '#/components/schemas/PerformanceIndex'
          description: SPI = EV / PV. `null` si PV = 0.
        estimateAtCompletion:
          $ref: '#/components/schemas/NullableMoney'
          description: EAC = BAC / CPI. `null` si CPI es `null` o 0.
        varianceAtCompletion:
          $ref: '#/components/schemas/NullableMoney'
          description: VAC = BAC − EAC. `null` si EAC es `null`.
        costStatus:
          $ref: '#/components/schemas/CostStatus'
        scheduleStatus:
          $ref: '#/components/schemas/ScheduleStatus'
        notes:
          type: array
          description: Motivos, en lenguaje natural, de cada indicador no calculable. Vacío cuando todo es calculable.
          items:
            type: string
      examples:
        - budgetAtCompletion: 40000.00
          plannedValue: 20000.00
          earnedValue: 16000.00
          actualCost: 20000.00
          costVariance: -4000.00
          scheduleVariance: -4000.00
          costPerformanceIndex: 0.8000
          schedulePerformanceIndex: 0.8000
          estimateAtCompletion: 50000.00
          varianceAtCompletion: -10000.00
          costStatus: OVER_BUDGET
          scheduleStatus: BEHIND_SCHEDULE
          notes: []
        - budgetAtCompletion: 1000.00
          plannedValue: 500.00
          earnedValue: 200.00
          actualCost: 0.00
          costVariance: 200.00
          scheduleVariance: -300.00
          costPerformanceIndex: null
          schedulePerformanceIndex: 0.4000
          estimateAtCompletion: null
          varianceAtCompletion: null
          costStatus: NOT_APPLICABLE
          scheduleStatus: BEHIND_SCHEDULE
          notes:
            - 'No aplica: sin costo registrado'

    EvmActivityReport:
      type: object
      description: Una actividad dentro del reporte, con sus datos crudos y sus indicadores.
      required: [id, name, owner, input, indicators]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner:
          $ref: '#/components/schemas/UserSummary'
        input:
          $ref: '#/components/schemas/ActivityMeasures'
          description: Datos crudos con los que se calcularon los indicadores.
        indicators:
          $ref: '#/components/schemas/EvmIndicators'
      examples:
