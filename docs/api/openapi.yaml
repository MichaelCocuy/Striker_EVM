openapi: 3.1.0

info:
  title: Striker EVM API
  version: 1.0.0
  summary: Contrato v1 del API de Striker EVM (Earned Value Management).
  description: |
    API REST de **Striker EVM**, herramienta interna para que los líderes de proyecto registren el
    avance de sus actividades y obtengan, en tiempo real, los indicadores de Valor Ganado (EVM)
    por actividad y consolidados por proyecto.

    Este documento es el **punto de sincronización entre backend y frontend** (módulo M1 de
    `docs/ARQUITECTURA.md`). El backend debe exponer exactamente estas rutas, esquemas y códigos;
    el frontend genera su cliente tipado a partir de este archivo y usa las fixtures de
    `docs/api/fixtures/` como mocks. Cualquier cambio al contrato se hace en un Pull Request propio.

    ## Convenciones

    - Prefijo de todas las rutas: `/api/v1`.
    - JSON en `camelCase`.
    - **Dinero** (BAC, AC, PV, EV, CV, SV, EAC, VAC): número con exactamente **2 decimales**,
      redondeo *half up*.
    - **Índices** (CPI, SPI): número con exactamente **4 decimales**, redondeo *half up*.
    - **Porcentajes**: escala 0–100 tal como los ingresa el usuario, hasta 2 decimales.
    - Indicador **no calculable** (división por cero): valor `null`, estado `NOT_APPLICABLE` y una
      explicación en `notes`. Nunca se inventan valores (ni 0, ni 1, ni infinito).
    - Los indicadores **no se persisten**: se calculan en cada consulta a partir de los datos crudos.
    - Todas las respuestas de error (4xx/5xx) usan el esquema `Error`.

    ## Autenticación y roles

    Todos los endpoints, salvo `GET /health` y `POST /auth/login`, exigen la cabecera
    `Authorization: Bearer <JWT>` (HS256, expiración 8 h, claims `sub` y `role`). Sin token válido
    responden `401`; cuando el rol no tiene permiso responden `403`.

    | Rol | Puede |
    |---|---|
    | `REGISTRAR` | Ver proyectos y reportes; crear actividades (queda como responsable); editar y eliminar **solo sus** actividades. |
    | `REVIEWER` | Todo lo anterior más: listar usuarios, crear/editar/eliminar proyectos y editar/eliminar cualquier actividad. |
  contact:
    name: Michael Cocuy (autor del reto técnico)
    url: https://github.com/MichaelCocuy/Striker_EVM
  license:
    name: Uso interno - reto técnico Trycore Colombia
    url: https://github.com/MichaelCocuy/Striker_EVM

servers:
  - url: /api/v1
    description: Ruta relativa al host que sirve el backend (en local, http://localhost:8000).

tags:
  - name: Sistema
    description: Verificación de salud del servicio y de la base de datos.
  - name: Autenticación
    description: Obtención del JWT y consulta del usuario autenticado.
  - name: Usuarios
    description: Consulta de usuarios para asignar responsables de actividades.
  - name: Proyectos
    description: Administración de proyectos (contenedores de actividades).
  - name: Actividades
    description: Administración de actividades y de sus datos crudos de avance y costo.
  - name: Reporte EVM
    description: Indicadores de Valor Ganado por actividad y consolidados por proyecto, con interpretación.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Sistema]
      operationId: getHealth
      summary: Verificar salud del servicio
      description: |
        Comprueba que el servicio responde y que la base de datos está accesible. Es público
        (no requiere token). Lo usa Docker Compose como *healthcheck* y el frontend para mostrar
        el estado de conexión.

        Una base de datos caída **no** es un error del servicio: se reporta con `200` y
        `database: unavailable`, tal como fija `docs/ARQUITECTURA.md` §5 (códigos: 200).
      security: []
      responses:
        '200':
          description: El servicio responde; `database` indica el estado de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                database: ok
                version: 1.0.0
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Iniciar sesión y obtener JWT
      description: |
        Valida email y contraseña y devuelve un JWT (HS256, 8 horas) junto con los datos del
        usuario. Es público. Las credenciales incorrectas responden `401` con código
        `UNAUTHORIZED`; un cuerpo mal formado responde `400` con código `VALIDATION_ERROR`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email o contraseña incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHORIZED
                message: Email o contraseña incorrectos
                details: []
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Autenticación]
      operationId: getCurrentUser
      summary: Obtener el usuario autenticado
      description: Devuelve el usuario dueño del token y su rol. Lo usa el frontend al recargar la página para restaurar la sesión.
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    get:
      tags: [Usuarios]
      operationId: listUsers
      summary: Listar usuarios
      description: |
        Lista todos los usuarios del sistema para que el `REVIEWER` pueda asignar responsables
        (`ownerId`) al crear o editar actividades. Solo rol `REVIEWER`; un `REGISTRAR` recibe `403`.
      responses:
        '200':
          description: Lista de usuarios ordenada por nombre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects:
    get:
      tags: [Proyectos]
      operationId: listProjects
      summary: Listar proyectos
      description: Lista todos los proyectos con su conteo de actividades. Disponible para ambos roles.
      responses:
        '200':
          description: Lista de proyectos ordenada por fecha de creación descendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Proyectos]
      operationId: createProject
      summary: Crear proyecto
      description: Crea un proyecto vacío. Solo rol `REVIEWER`. El usuario autenticado queda registrado como `createdBy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Proyecto creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Proyectos]
      operationId: getProject
      summary: Obtener proyecto
      description: Devuelve un proyecto por su identificador, con el conteo de actividades. Disponible para ambos roles.
      responses:
        '200':
          description: Proyecto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Proyectos]
      operationId: updateProject
      summary: Editar proyecto
      description: Reemplaza nombre y descripción del proyecto. Solo rol `REVIEWER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Proyecto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Proyectos]
      operationId: deleteProject
      summary: Eliminar proyecto
      description: Elimina el proyecto y, en cascada, todas sus actividades. Solo rol `REVIEWER`.
      responses:
        '204':
          description: Proyecto eliminado. Sin cuerpo.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}/activities:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Actividades]
      operationId: listActivities
      summary: Listar actividades de un proyecto
      description: |
        Devuelve las actividades del proyecto con sus **datos crudos** (presupuesto, porcentajes y
        costo real), sin indicadores. Para los indicadores usar `GET /projects/{projectId}/evm`.
        Disponible para ambos roles. Un proyecto sin actividades responde `200` con `[]`.
      responses:
        '200':
          description: Lista de actividades ordenada por fecha de creación ascendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Actividades]
      operationId: createActivity
      summary: Crear actividad
      description: |
        Crea una actividad dentro del proyecto. Disponible para ambos roles con esta regla de
        responsable:

        - `REGISTRAR`: `ownerId` es opcional y, si se envía, debe ser su propio id; la actividad
          queda a su nombre.
        - `REVIEWER`: `ownerId` es **obligatorio** y debe corresponder a un usuario existente.

        Un `ownerId` ausente (REVIEWER) o inexistente responde `400` con código
        `VALIDATION_ERROR`; un `ownerId` ajeno (REGISTRAR) responde `403` con código `FORBIDDEN`,
        porque la política de responsables prohíbe la acción en lugar de corregirla en silencio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201':
          description: Actividad creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}/activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ActivityId'
    put:
      tags: [Actividades]
      operationId: updateActivity
      summary: Editar actividad
      description: |
        Reemplaza los datos de la actividad. `REVIEWER` puede editar cualquier actividad y
        reasignar `ownerId`; `REGISTRAR` solo puede editar las actividades de las que es
        responsable y no puede cambiar el responsable (cualquier otra combinación responde `403`).
        La actividad debe pertenecer al proyecto indicado; si no, responde `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '200':
          description: Actividad actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Actividades]
      operationId: deleteActivity
      summary: Eliminar actividad
      description: Elimina la actividad. `REVIEWER` puede eliminar cualquiera; `REGISTRAR` solo las propias (`403` en caso contrario).
      responses:
        '204':
          description: Actividad eliminada. Sin cuerpo.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}/evm:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Reporte EVM]
      operationId: getProjectEvmReport
      summary: Obtener reporte EVM del proyecto
      description: |
        Calcula y devuelve, en una sola llamada, los indicadores de Valor Ganado de **cada
        actividad** y el **consolidado del proyecto**, con su interpretación (estado de costo y de
        cronograma). Es la única fuente de indicadores: el frontend no calcula nada.

        Reglas de cálculo (ver `docs/EVM_GUIA.md`):

        - `PV = %plan × BAC`, `EV = %real × BAC`, `CV = EV − AC`, `SV = EV − PV`,
          `CPI = EV / AC`, `SPI = EV / PV`, `EAC = BAC / CPI`, `VAC = BAC − EAC`.
        - El consolidado **suma los valores en dinero** de las actividades y recalcula varianzas,
          índices y pronósticos sobre las sumas. Nunca promedia índices.
        - Divisiones por cero → valor `null`, estado `NOT_APPLICABLE` y motivo en `notes`.
        - Un proyecto sin actividades responde `200` con `activities: []` y consolidado en cero /
          `null` / `NOT_APPLICABLE` (nunca `404`).

        Disponible para ambos roles. El frontend vuelve a llamar este endpoint tras cada
        alta, edición o borrado de actividad.
      responses:
        '200':
          description: Reporte EVM calculado a la fecha de la consulta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvmReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtenido en `POST /auth/login`. Enviar como `Authorization: Bearer <token>`.
        Claims: `sub` (id del usuario), `role` (`REGISTRAR` | `REVIEWER`), `exp` (8 h).

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identificador (UUID) del proyecto.
      schema:
        type: string
        format: uuid
      example: 22222222-2222-4222-8222-000000000001
    ActivityId:
      name: activityId
      in: path
      required: true
      description: Identificador (UUID) de la actividad. Debe pertenecer al proyecto de la ruta.
      schema:
        type: string
        format: uuid
      example: 33333333-3333-4333-8333-000000000002

  responses:
    BadRequest:
      description: Cuerpo inválido o regla de negocio de entrada incumplida (`VALIDATION_ERROR`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: La solicitud contiene campos inválidos
            details:
              - field: plannedProgressPercent
                message: plannedProgressPercent must be between 0 and 100
    Unauthorized:
      description: Token ausente, inválido o expirado (`UNAUTHORIZED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Se requiere un token de acceso válido
            details: []
    Forbidden:
      description: El usuario está autenticado pero su rol o su relación con el recurso no le permiten la acción (`FORBIDDEN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Solo un usuario con rol REVIEWER puede crear proyectos
            details: []
    NotFound:
      description: El recurso indicado en la ruta no existe (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Proyecto 22222222-2222-4222-8222-000000000009 no encontrado
            details: []
    InternalError:
      description: Error inesperado del servidor (`INTERNAL_ERROR`). El cuerpo nunca expone detalles internos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Error interno del servidor
            details: []

  schemas:
    # ------------------------------------------------------------------ primitivos compartidos
    Money:
      type: number
      format: double
      description: Importe monetario con exactamente 2 decimales (redondeo *half up* al construir la respuesta).
      examples: [40000.00, -4000.00, 8333.33]

    NullableMoney:
      type: [number, 'null']
      format: double
      description: Importe monetario con 2 decimales, o `null` cuando el indicador no es calculable.
      examples: [50000.00, null]

    PerformanceIndex:
      type: [number, 'null']
      format: double
      minimum: 0
      description: Índice de desempeño (CPI o SPI) con exactamente 4 decimales (redondeo *half up*), o `null` cuando no es calculable (denominador cero).
      examples: [0.8000, 1.1111, null]

    Percent:
      type: number
      format: double
      minimum: 0
      maximum: 100
      description: Porcentaje de avance en escala 0–100, hasta 2 decimales.
      examples: [50.00, 100.00, 0]

    UserSummary:
      type: object
      description: Referencia resumida a un usuario (responsable de actividad o creador de proyecto).
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
      examples:
        - id: 11111111-1111-4111-8111-000000000002
          fullName: Carlos Registrador

    # ------------------------------------------------------------------ errores
    ErrorCode:
      type: string
      description: |
        Catálogo de códigos de error del API. `HTTP_ERROR` es el código de los estados que
        produce el framework y ningún caso de uso levanta (por ejemplo `405 Method Not Allowed`).
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - HTTP_ERROR
        - INTERNAL_ERROR

    ErrorDetail:
      type: object
      description: Detalle de un problema puntual, normalmente asociado a un campo del cuerpo.
      required: [message]
      properties:
        field:
          type: [string, 'null']
          description: Nombre del campo (`camelCase`) al que aplica el detalle, o `null` si es general.
        message:
          type: string
          description: Descripción legible del problema.
        type:
          type: [string, 'null']
          description: |
            Identificador técnico del error de validación (por ejemplo `int_parsing`). Solo
            aparece cuando la falla es de forma del cuerpo, no de una regla de negocio.
      examples:
        - field: budgetAtCompletion
          message: budgetAtCompletion must be greater than 0

    Error:
      type: object
      description: Cuerpo uniforme de todas las respuestas 4xx/5xx.
      required: [code, message, details]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Mensaje legible para el usuario final.
        details:
          type: array
          description: Detalles adicionales (uno por campo inválido en `VALIDATION_ERROR`); vacío en los demás casos.
          items:
            $ref: '#/components/schemas/ErrorDetail'
      examples:
        - code: VALIDATION_ERROR
          message: La solicitud contiene campos inválidos
          details:
            - field: plannedProgressPercent
              message: plannedProgressPercent must be between 0 and 100

    # ------------------------------------------------------------------ sistema
    ComponentStatus:
      type: string
      description: Estado de un componente del servicio.
      enum: [ok, unavailable]

    HealthResponse:
      type: object
      description: Estado del servicio y de la base de datos.
      required: [status, database]
      properties:
        status:
          $ref: '#/components/schemas/ComponentStatus'
          description: Estado del servicio HTTP; es `ok` siempre que el API alcance a responder.
        database:
          $ref: '#/components/schemas/ComponentStatus'
          description: Estado de la conexión a PostgreSQL.
        version:
          type: string
          description: Versión del backend desplegado.
      examples:
        - status: ok
          database: ok
          version: 1.0.0

    # ------------------------------------------------------------------ autenticación y usuarios
    Role:
      type: string
      description: |
        Rol del usuario.
        - `REGISTRAR`: registra el avance y el costo real de sus actividades.
        - `REVIEWER`: administra proyectos, asigna responsables y revisa el reporte consolidado.
      enum: [REGISTRAR, REVIEWER]

    LoginRequest:
      type: object
      description: Credenciales de acceso.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
      examples:
        - email: revisor@striker.local
          password: Striker2026!

    LoginResponse:
      type: object
      description: Token de acceso y usuario autenticado.
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT firmado (HS256).
        tokenType:
          type: string
          enum: [bearer]
        expiresIn:
          type: integer
          description: Segundos de validez del token desde su emisión (8 horas).
          examples: [28800]
        user:
          $ref: '#/components/schemas/User'
      examples:
        - accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMTExMTExMS0xMTExLTQxMTEtODExMS0wMDAwMDAwMDAwMDEiLCJyb2xlIjoiUkVWSUVXRVIifQ.c2lnbmF0dXJl
          tokenType: bearer
          expiresIn: 28800
          user:
            id: 11111111-1111-4111-8111-000000000001
            email: revisor@striker.local
            fullName: Laura Revisora
            role: REVIEWER

    User:
      type: object
      description: Usuario del sistema.
      required: [id, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      examples:
        - id: 11111111-1111-4111-8111-000000000001
          email: revisor@striker.local
          fullName: Laura Revisora
          role: REVIEWER

    # ------------------------------------------------------------------ proyectos
    ProjectInput:
      type: object
      description: Datos editables de un proyecto (POST y PUT).
