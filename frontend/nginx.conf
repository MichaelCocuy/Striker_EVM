server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API is served from the same origin as the app; `backend` is the Compose service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI of the backend, reachable from the same origin as the app.
    location /api-docs {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path is resolved by the router in index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
